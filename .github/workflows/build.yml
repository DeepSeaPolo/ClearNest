name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify cleanup guards using disposable fixtures
        shell: pwsh
        run: dotnet run --project verification/Verification.csproj -c Release
      - name: Publish portable application
        shell: pwsh
        run: ./build.ps1 -Portable
      - name: Verify native main and Mini window switching
        shell: powershell
        run: ./verification/window-modes.ps1
      - name: Verify executable and record checksums
        shell: pwsh
        run: |
          $exe = 'publish/portable/ClearNest.exe'
          if (!(Test-Path $exe)) { throw 'ClearNest.exe missing' }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Invalid PE executable' }
          Get-ChildItem publish/portable -Recurse -File | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-String -Width 4096 | Set-Content publish/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ClearNest-win11-x64
          path: |
            publish/portable/
            publish/SHA256.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ClearNest-ui-preview
          path: publish/ui-checks/
          if-no-files-found: warn
      - name: Publish v0.2.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          Compress-Archive -Path publish/portable,publish/SHA256.txt -DestinationPath ClearNest-Win11-x64-v0.2.0.zip
          if (!(Test-Path ClearNest-Win11-x64-v0.2.0.zip)) { throw 'Package missing' }
          gh release view v0.2.0 2>$null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create v0.2.0 ClearNest-Win11-x64-v0.2.0.zip --target $env:GITHUB_SHA --title 'ClearNest v0.2.0 - Dashboard, themes and centered title bar' --notes 'Dashboard-first native WinUI layout, persistent system/light/dark themes, five accent colors, Mica switch, Mini behavior settings and Edge-inspired centered title bar. Verified cleanup guards, theme persistence and mutually exclusive window switching.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
