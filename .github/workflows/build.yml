name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify cleanup guards using disposable fixtures
        shell: pwsh
        run: dotnet run --project verification/Verification.csproj -c Release
      - name: Publish standalone single-file application
        shell: pwsh
        run: ./build.ps1 -SingleFile
      - name: Verify single-file distribution and isolate EXE
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $files = @(Get-ChildItem publish/single -Recurse -File)
          $files | Select-Object FullName,Length | Format-Table
          if ($files.Count -ne 1 -or $files[0].Name -ne 'ClearNest.exe') { throw 'Publish output is not a single EXE' }
          New-Item -ItemType Directory -Force publish/isolated | Out-Null
          Copy-Item publish/single/ClearNest.exe publish/isolated/ClearNest.exe
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path 'publish/isolated/ClearNest.exe'))
          if ($null -eq $icon) { throw 'Embedded application icon missing' }
          $icon.Dispose()
      - name: Download original release for rename regression reproduction
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/single-exe-startup'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          New-Item -ItemType Directory -Force publish/baseline | Out-Null
          gh release download v0.4.0 --pattern ClearNest-v0.4.0-win11-x64.exe --dir publish/baseline
          if ($LASTEXITCODE -ne 0) { throw 'Baseline download failed' }
      - name: Verify release filename and browser duplicate startup
        shell: powershell
        run: |
          $baseline='publish/baseline/ClearNest-v0.4.0-win11-x64.exe'
          if (Test-Path $baseline) { ./verification/release-startup.ps1 -BaselineExecutable $baseline }
          else { ./verification/release-startup.ps1 }
      - name: Verify EXE and checksum
        shell: pwsh
        run: |
          $exe = 'publish/single/ClearNest.exe'
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Invalid PE executable' }
          if (@(Get-ChildItem publish/isolated -Recurse -File).Count -ne 1) { throw 'Startup created files beside the EXE' }
          Get-FileHash $exe -Algorithm SHA256 | Format-List | Out-String | Set-Content publish/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ClearNest-single-exe-win11-x64
          path: |
            publish/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ClearNest-ui-preview
          path: publish/ui-checks/
          if-no-files-found: warn
      - name: Publish v0.4.1 startup fix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v0.4.1 2>$null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create v0.4.1 publish/release/ClearNest-v0.4.1-win11-x64.exe publish/release/SHA256.txt --target $env:GITHUB_SHA --title 'ClearNest v0.4.1 - Fix silent startup after EXE rename' --notes 'Fixes a packaging bug in v0.4.0: the public versioned filename could prevent WinUI from finding its XAML resources and the app would exit before showing a window. Uses a stable resources.pri name. Tests now launch the exact release asset and a browser duplicate filename from isolated directories and fresh extraction caches, and exercise themes and main/Mini switching. Managed startup failures show an error and write %LOCALAPPDATA%\ClearNest\Logs\startup.log. Windows Server 2025 automated validation; ordinary Windows 11 manual compatibility is still pending.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
