name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify cleanup guards using disposable fixtures
        shell: pwsh
        run: dotnet run --project verification/Verification.csproj -c Release
      - name: Publish standalone single-file application
        shell: pwsh
        run: ./build.ps1 -SingleFile
      - name: Verify single-file distribution and isolate EXE
        shell: pwsh
        run: |
          $files = @(Get-ChildItem publish/single -Recurse -File)
          $files | Select-Object FullName,Length | Format-Table
          if ($files.Count -ne 1 -or $files[0].Name -ne 'ClearNest.exe') { throw 'Publish output is not a single EXE' }
          New-Item -ItemType Directory -Force publish/isolated | Out-Null
          Copy-Item publish/single/ClearNest.exe publish/isolated/ClearNest.exe
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path 'publish/isolated/ClearNest.exe'))
          if ($null -eq $icon) { throw 'Embedded application icon missing' }
          $icon.Dispose()
      - name: Verify native main and Mini window switching
        shell: powershell
        env:
          DOTNET_BUNDLE_EXTRACT_BASE_DIR: ${{ runner.temp }}/clearnest-bundle
        run: ./verification/window-modes.ps1
      - name: Verify EXE and checksum
        shell: pwsh
        run: |
          $exe = 'publish/single/ClearNest.exe'
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Invalid PE executable' }
          if (@(Get-ChildItem publish/isolated -Recurse -File).Count -ne 1) { throw 'Startup created files beside the EXE' }
          Get-FileHash $exe -Algorithm SHA256 | Format-List | Out-String | Set-Content publish/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ClearNest-single-exe-win11-x64
          path: |
            publish/single/
            publish/SHA256.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ClearNest-ui-preview
          path: publish/ui-checks/
          if-no-files-found: warn
      - name: Publish v0.2.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          Copy-Item publish/single/ClearNest.exe ClearNest-v0.2.1-win11-x64.exe
          gh release view v0.2.1 2>$null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create v0.2.1 ClearNest-v0.2.1-win11-x64.exe --target $env:GITHUB_SHA --title 'ClearNest v0.2.1 - Single EXE and application icon' --notes 'One self-contained Windows 11 x64 EXE with embedded runtime, native dependencies and custom icon. Dependencies are extracted to the bundle cache at startup; no adjacent dependency folder is required. Dashboard, themes, preferences and mutually exclusive Mini mode are retained.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
